name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release version
        run: |
          version="${RELEASE_TAG#v}"
          grep -Fq "<Version>$version</Version>" ValheimTelemetry.csproj
          grep -Fq "PluginVersion = \"$version\";" src/Plugin.cs

      - name: Install SteamCMD prerequisites
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes lib32gcc-s1 lib32stdc++6

      - name: Download Valheim server assemblies
        env:
          VALHEIM_DIR: ${{ runner.temp }}/valheim
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd" "$VALHEIM_DIR"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            --output "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          chmod +x "$RUNNER_TEMP/steamcmd/steamcmd.sh"
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +force_install_dir "$VALHEIM_DIR" \
              +login anonymous \
              +app_update 896660 validate \
              +quit; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "SteamCMD failed to download the Valheim server after 3 attempts."
              exit 1
            fi

            echo "SteamCMD download failed on attempt $attempt; retrying in 15 seconds."
            sleep 15
          done

      - name: Download BepInEx references
        env:
          VALHEIM_DIR: ${{ runner.temp }}/valheim
        run: |
          curl --fail --location --retry 3 \
            https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.2/BepInEx_linux_x64_5.4.23.2.zip \
            --output "$RUNNER_TEMP/bepinex.zip"
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$VALHEIM_DIR"
          test -f "$VALHEIM_DIR/BepInEx/core/BepInEx.dll"
          test -f "$VALHEIM_DIR/BepInEx/core/0Harmony.dll"
          test -f "$VALHEIM_DIR/valheim_server_Data/Managed/assembly_valheim.dll"

      - name: Build plugin
        env:
          VALHEIM_DIR: ${{ runner.temp }}/valheim
        run: dotnet build ValheimTelemetry.csproj --configuration Release "-p:ValheimDir=$VALHEIM_DIR"

      - name: Package plugin
        run: |
          zip -j "ValheimTelemetry-${RELEASE_TAG}.zip" \
            bin/Release/net48/ValheimTelemetry.dll

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net48/ValheimTelemetry.dll
            ValheimTelemetry-${{ env.RELEASE_TAG }}.zip
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: .github/release-notes/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
